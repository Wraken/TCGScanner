<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork: dimensional rift motif -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1426"/>
      <stop offset="1" stop-color="#110f1c"/>
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57c8d9"/>
      <stop offset="0.5" stop-color="#9184d9"/>
      <stop offset="1" stop-color="#d957b8"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-20%" width="220%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="300" height="280" fill="url(#bg)"/>
  <!-- rift glow -->
  <path d="M158 0 L138 62 L160 100 L128 154 L162 194 L136 244 L150 280 L158 280 L148 242 L176 192 L142 152 L172 98 L150 60 L168 0 Z"
        fill="url(#rift)" opacity="0.5" filter="url(#blur)"/>
  <!-- rift crack -->
  <path d="M156 0 L148 0 L134 60 L156 98 L126 152 L158 192 L134 242 L146 280 L154 280 L144 240 L170 190 L138 150 L168 96 L146 58 L164 0 Z"
        fill="url(#rift)" opacity="0.95"/>
  <!-- floating shards -->
  <g fill="#57c8d9">
    <path d="M92 84 L106 94 L88 104 Z" opacity="0.5"/>
    <path d="M64 176 L76 170 L74 188 Z" opacity="0.35"/>
  </g>
  <g fill="#d957b8">
    <path d="M214 120 L230 128 L212 140 Z" opacity="0.5"/>
    <path d="M236 210 L248 204 L246 222 Z" opacity="0.35"/>
    <path d="M204 48 L214 42 L214 58 Z" opacity="0.4"/>
  </g>
  <circle cx="150" cy="126" r="2.2" fill="#e8d6f2" opacity="0.8"/>
</svg>
